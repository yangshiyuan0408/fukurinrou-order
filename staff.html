  function renderMenuEditor(){const root=document.createElement("div");function paint(){const d=currentDraft();root.innerHTML="";d.forEach((sec,ci)=>{const cat=document.createElement("div");cat.className="menu-edit-cat";cat.dataset.ci=ci;cat.innerHTML=`<div class="cat-title-row"><input class="cat-name-input" value="${attr(sec.cat)}">${sec.availability?`<span class="availability-admin">${sec.availability==="lunch"?"昼限定":"夜限定"}</span>`:""}<button class="del-cat-btn">カテゴリ削除</button></div>${sec.items.map((it,ii)=>`<div class="menu-edit-row" data-ii="${ii}"><input class="mi-name" type="text" value="${attr(it.name)}"><input class="mi-price" type="number" value="${it.price}"><input class="mi-desc" type="text" placeholder="説明" value="${attr(it.desc||'')}"><label class="mi-soldout-label"><input class="mi-soldout" type="checkbox" ${it.soldOut?'checked':''}> 売り切れ</label><button class="mi-delete-btn">削除</button></div>`).join("")}<button class="add-item-btn">＋ 料理を追加</button>`;cat.querySelector(".del-cat-btn").onclick=()=>{if(confirm(`「${sec.cat}」を削除しますか？`)){syncDraft(root);currentDraft().splice(ci,1);paint()}};cat.querySelector(".add-item-btn").onclick=()=>{syncDraft(root);currentDraft()[ci].items.push({id:genId(),name:"新しい料理",price:0,desc:"",soldOut:false});paint()};cat.querySelectorAll(".mi-delete-btn").forEach((b,ii)=>b.onclick=()=>{syncDraft(root);currentDraft()[ci].items.splice(ii,1);paint()});root.appendChild(cat)});const add=document.createElement("button");add.className="add-cat-btn";add.textContent="＋ 新しいカテゴリを追加";add.onclick=()=>{syncDraft(root);currentDraft().push({cat:"新しいカテゴリ",items:[]});paint()};root.appendChild(add);const a=document.createElement("div");a.className="menu-editor-actions";a.innerHTML='<button class="btn-primary" id="save">変更を保存する</button><button class="btn-ghost" id="discard">変更を破棄</button><span class="save-status" id="st"></span>';a.querySelector("#discard").onclick=()=>{state.menuDraft=null;renderStaff()};a.querySelector("#save").onclick=async()=>{syncDraft(root);if(await saveMenu(currentDraft())){state.menu=JSON.parse(JSON.stringify(currentDraft()));rebuildIndex(state.menu);state.menuDraft=null;a.querySelector("#st").textContent="保存しました"}};root.appendChild(a)}paint();return root}
  function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}function attr(s){return esc(s)}
  function subscribe(){
    db.ref("menu").off();
    db.ref("orders").off();
    db.ref("menu").on("value",s=>{
      if(s.exists()){
        state.menu=mergeMenuV3(s.val());
        rebuildIndex(state.menu);
        if(state.role==="cashier"&&state.cashierTab!=="menu") renderStaff();
      }
    });

    if(isStaff()){
      db.ref("orders").on("value",s=>{
        const next=ordersFrom(s.val());
        const ids=new Set(next.map(o=>o.id));
        let newOrders=[];
        if(!orderReady){
          knownIds=ids;
          orderReady=true;
        }else{
          newOrders=next.filter(o=>o.status==="new"&&!knownIds.has(o.id));
          knownIds=ids;
        }
        state.orders=next;
        renderStaff();
        // v5.3: キッチン端末だけ、新規注文を中国語で読み上げる。
        if(state.role==="kitchen"&&newOrders.length&&window.FUKURIN_V53_VOICE){
          window.FUKURIN_V53_VOICE.notifyOrders(newOrders);
        }
      });
    }
  }
  async function init(){
    // 画面を止めないため、先にログイン画面を表示する。
    renderLogin();
    try{
      const user=await Promise.race([
        new Promise(r=>{const u=auth.onAuthStateChanged(x=>{u();r(x)})}),
        new Promise(r=>setTimeout(()=>r(null),4000))
      ]);
      if(!isStaff(user)) return;
      state.menu=await loadMenu(); rebuildIndex(state.menu);
      state.orders=await loadOrders();
      if(state.role) renderStaff(); else renderRole();
      subscribe();
    }catch(e){ console.error("staff init failed",e); renderLogin(); }
  }
  init();
})();
</script><script src="v4-enhance.js?v=53"></script><script src="admin-editor-v52.js?v=52"></script></body></html>
