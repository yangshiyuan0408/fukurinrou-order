/* ===== 福林楼 v3: 写真・昼夜メニュー ===== */

  function normalizeMenuV51(menu){
    const soup=menu.find(sec=>sec.cat==="スープ");
    if(soup&&Array.isArray(soup.items)){
      const pairs=[
        ["soup_fukahire","soup_fukahire_small",700],
        ["soup_suuratan","soup_suuratan_small",200],
        ["soup_tamago","soup_tamago_small",200],
        ["soup_harusame","soup_harusame_small",200],
        ["soup_corn","soup_corn_small",200]
      ];
      pairs.forEach(([normalId,smallId,fallbackDiff])=>{
        const normal=soup.items.find(it=>it.id===normalId);
        const small=soup.items.find(it=>it.id===smallId);
        if(!normal)return;
        const opts=(normal.options||[]).filter(op=>op&&op.name!=="サイズ"&&op.name!=="大きさ");
        if(small){
          const diff=Math.max(0,Number(normal.price||0)-Number(small.price||0))||fallbackDiff;
          opts.unshift({name:"サイズ",choices:[{label:"小",delta:-diff},{label:"普通",delta:0}],default:"普通"});
          normal.options=opts;
          normal.desc=(normal.desc==="通常サイズ"||normal.desc==="小サイズ")?"":(normal.desc||"");
          soup.items=soup.items.filter(it=>it.id!==smallId);
        }else if(!(normal.options||[]).some(op=>op&&op.name==="サイズ")){
          opts.unshift({name:"サイズ",choices:[{label:"小",delta:-fallbackDiff},{label:"普通",delta:0}],default:"普通"});
          normal.options=opts;
        }
      });
    }
    return menu;
  }

  function renderHeader(){const d=document.createElement("div");d.className="cust-header";const st=serviceText();d.innerHTML=`<div class="sub">${escapeHtml(T("お好きな料理を選んでご注文ください"))}</div><div class="table-line"><span>${escapeHtml(T("注文テーブル"))}</span><span class="table-pill">${TABLE}</span></div><div class="service-banner"><span class="service-dot"></span><strong>${escapeHtml(T(st.label))}</strong></div><div class="service-note">${escapeHtml(T(st.note))}</div>`;return d}
  function groupSections(){const target=state.menuGroup==="drink"?"drink":"food";return visibleSections().filter(sec=>(sec.menuGroup==="drink"?"drink":"food")===target)}
  function renderTabs(){
    const secs=groupSections();
    if(!secs.some(x=>x.cat===state.activeCat)) state.activeCat=secs[0]?.cat||"";
    const d=document.createElement("div");
    d.className="menu-nav-stack";
    d.dataset.group=state.menuGroup;
    d.innerHTML=`<div class="menu-group-switch"><button class="menu-group-btn ${state.menuGroup==='food'?'active':''}" data-group="food">${escapeHtml(T('料理'))}</button><button class="menu-group-btn ${state.menuGroup==='drink'?'active':''}" data-group="drink">${escapeHtml(T('ドリンク・お酒'))}</button></div><div class="cat-tabs">${secs.map(sec=>`<button class="cat-tab ${sec.cat===state.activeCat?'active':''} ${sec.cat==='新商品・おすすめ'?'recommend-tab':''}" data-zone="${sec.availability||'regular'}" data-cat="${escapeHtml(sec.cat)}">${escapeHtml(T(sec.cat))}</button>`).join("")}</div>`;
    d.querySelectorAll('.menu-group-btn').forEach(b=>b.onclick=()=>{
      if(state.menuGroup===b.dataset.group)return;
      state.menuGroup=b.dataset.group;
      state.activeCat="";
      renderCustomer();
      window.scrollTo({top:document.querySelector('.cust-header')?.offsetTop||0,behavior:'smooth'});
    });
    d.querySelectorAll(".cat-tab").forEach(b=>b.onclick=()=>{state.activeCat=b.dataset.cat;activateTab(state.activeCat);document.getElementById(`sec-${b.dataset.cat}`)?.scrollIntoView({behavior:"smooth",block:"start"})});
    return d
  }
  function itemBadges(sec,it){const a=[];if(sec.menuGroup==='drink'){a.push({v:'ドリンク・お酒',alt:true});if(it.alcohol)a.push({v:'アルコール',alt:true});else a.push({v:'ソフトドリンク'});}else{a.push({v:sec.availability==='lunch'?'昼限定':sec.availability==='dinner'?'夜限定':'通常',alt:!!sec.availability});}if(/セット/.test(sec.cat))a.push({v:'セット'});else if(/定食/.test(sec.cat))a.push({v:'定食'});else if(/麺/.test(sec.cat))a.push({v:'麺類'});else if(/飯|丼|炒飯/.test(sec.cat))a.push({v:'飯類'});const opts=itemOptions(it);if(opts.some(x=>x.name==='お召し上がり方'))a.push({v:'定食・単品'});if(opts.some(x=>/辛さ/.test(x.name)))a.push({v:'辛さ調整',alt:true});return a.slice(0,4)}
  function optionActionText(it){const opts=itemOptions(it),parts=[];if(opts.some(x=>x.name==='お召し上がり方'))parts.push('定食・単品');if(opts.some(x=>/辛さ/.test(x.name)))parts.push('辛さ');if(opts.some(x=>/量/.test(x.name)))parts.push('量');if(!parts.length)return T('内容を選ぶ');const key=parts.slice(0,2).join('・')+'を選ぶ';return T(key)===key?(parts.slice(0,2).map(T).join(' / ')+' '+(I18N.getLang()==='en'?'Choose':I18N.getLang()==='ko'?'선택':'を選ぶ')):T(key)}
  function renderMenu(){const secs=groupSections();const d=document.createElement("div");d.className="menu-section";d.innerHTML=secs.map(sec=>`<div id="sec-${escapeHtml(sec.cat)}" class="${sec.availability?'special-top':''} ${sec.menuGroup==='drink'?'drink-section':''}"><div class="section-head"><h3 class="${sec.cat==='新商品・おすすめ'?'recommend-title':''}">${escapeHtml(T(sec.cat))}${sec.availability?`<span class="availability-chip">${escapeHtml(T(sec.availability==='lunch'?'昼限定':'夜限定'))}</span>`:""}</h3>${sec.note?`<div class="section-note">${escapeHtml(T(sec.note))}</div>`:""}</div>${(sec.items||[]).map(it=>{const opts=itemOptions(it),q=itemCartQty(it.id),img=it.image||"",hasDelta=opts.some(op=>(op.choices||[]).some(ch=>normalizedChoice(ch).delta!==0)),shownPrice=Math.max(0,Number(it.price)+optionMinDelta(opts)),badges=itemBadges(sec,it).map(b=>`<span class="item-badge ${b.alt?'alt':''}">${escapeHtml(T(b.v))}</span>`).join('');return `<div class="menu-row ${it.soldOut?'sold-out':''}">${img?`<div class="dish-photo-wrap"><img class="dish-photo" src="${escapeHtml(img)}" alt="${escapeHtml(T(it.name))}" loading="lazy" onerror="this.closest('.dish-photo-wrap').style.display='none'"><span class="image-badge ${it.imageExact?'exact':''}">${escapeHtml(T(it.imageExact?'店内写真':'イメージ'))}</span></div>`:''}<div class="info">${badges?`<div class="item-badges">${badges}</div>`:''}<div class="name">${escapeHtml(T(it.name))}</div>${it.desc?`<div class="desc">${escapeHtml(T(it.desc))}</div>`:""}<div class="price">&yen;${shownPrice.toLocaleString()}${hasDelta?'〜':""}</div>${opts.length?`<span class="option-hint">${escapeHtml(T(it.alcohol?'飲み方などを選べます':'定食・単品 / 辛さ / サイズなどを選べます'))}</span>`:""}</div>${it.soldOut?`<div class="sold-out-tag">${escapeHtml(T('売り切れ'))}</div>`:opts.length?`<button class="add-option-btn" data-opt="${it.id}"><span class="option-button-label">${escapeHtml(optionActionText(it))}</span><span class="mini-count">${q?`${q} ${escapeHtml(T('点'))}`:escapeHtml(T('選択してください'))}</span></button>`:`<div class="qty-stepper"><button data-minus="${it.id}">−</button><div class="n">${q}</div><button data-plus="${it.id}">+</button></div>`}</div>`}).join("")}</div>`).join("");d.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>addSimple(MENU_INDEX[b.dataset.plus]));d.querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>removeSimple(MENU_INDEX[b.dataset.minus]));d.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>openOptionDialog(MENU_INDEX[b.dataset.opt]));return d}
  function openOptionDialog(it){const opts=itemOptions(it),ov=document.createElement("div");ov.className="option-overlay";const groups=opts.map((op,oi)=>{const choices=(op.choices||[]).map(normalizedChoice),def=op.default||choices[0]?.label||"";return `<div class="option-group"><div class="option-group-title">${escapeHtml(T(op.name))}</div><div class="option-choices">${choices.map((ch,ci)=>`<label class="option-choice"><input type="radio" name="op${oi}" value="${ci}" ${ch.label===def?'checked':''}><span>${escapeHtml(T(ch.label))}${ch.delta?`<small>${deltaText(ch.delta)}</small>`:""}</span></label>`).join("")}</div></div>`}).join("");ov.innerHTML=`<div class="option-card"><h2>${escapeHtml(T(it.name))}</h2><div class="op-price">${escapeHtml(T('基本価格'))} &yen;${Number(it.price).toLocaleString()}</div><div class="option-guide"><strong>${escapeHtml(optionActionText(it))}</strong><div class="option-strong-sep">${escapeHtml(T('定食・単品、辛さ、大盛り、その他のご要望を分けて選べます。'))}</div></div>${groups}<div class="option-price-preview" id="pricePreview"></div><div class="option-group"><div class="option-group-title">${escapeHtml(T('その他のご要望（任意）'))}</div><textarea id="optionNote" class="option-note" maxlength="60" rows="2" placeholder="${escapeHtml(T('例：ねぎ少なめ（対応できる範囲）'))}"></textarea></div><div class="option-actions"><button class="btn-secondary" id="cancelOption">${escapeHtml(T('キャンセル'))}</button><button class="btn-primary" id="addOption">${escapeHtml(T('この内容で追加'))}</button></div></div>`;document.body.appendChild(ov);const calc=()=>{let delta=0;opts.forEach((op,oi)=>{const checked=ov.querySelector(`input[name="op${oi}"]:checked`),idx=checked?Number(checked.value):0;delta+=normalizedChoice((op.choices||[])[idx]).delta});ov.querySelector("#pricePreview").textContent=`${T('選択後')}：¥${Math.max(0,Number(it.price)+delta).toLocaleString()}`;return delta};ov.querySelectorAll('input[type="radio"]').forEach(x=>x.onchange=calc);calc();ov.querySelector("#cancelOption").onclick=()=>ov.remove();ov.onclick=e=>{if(e.target===ov)ov.remove()};ov.querySelector("#addOption").onclick=()=>{const selections={};let totalDelta=0;opts.forEach((op,oi)=>{const checked=ov.querySelector(`input[name="op${oi}"]:checked`),idx=checked?Number(checked.value):0,ch=normalizedChoice((op.choices||[])[idx]);totalDelta+=ch.delta;selections[op.name]=ch.delta?`${ch.label}（${deltaText(ch.delta)}）`:ch.label});const note=ov.querySelector("#optionNote").value.trim();ov.remove();addCartLine(it,selections,note,totalDelta)}}
  function renderCartBar(){const d=document.createElement("div");d.className="cart-bar";d.innerHTML=`<div><span class="count">${cartCount()}</span><span class="total">&yen;${cartTotal().toLocaleString()}</span></div><button class="go">${escapeHtml(T('注文内容を確認'))}</button>`;d.querySelector(".go").onclick=()=>{state.screen="review";renderCustomer()};return d}
  function localizedOptions(l){const parts=Object.entries(l.selections||{}).map(([k,v])=>{let vv=String(v);const m=vv.match(/^(.*?)(（[+\-]¥.*）)$/);if(m)vv=T(m[1])+m[2];else vv=T(vv);return `${T(k)}：${vv}`});if(l.note)parts.push(`${T('要望')}：${l.note}`);return parts.join(' / ')}
  function cartHasAlcohol(){return cartLines().some(l=>!!MENU_INDEX[l.id]?.alcohol)}
  async function submitReviewedOrder(btn,d){
    btn.disabled=true;btn.textContent=T("送信中…");
    const id="o"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    const items=cartLines().map(l=>({id:l.id,name:l.name,qty:l.qty,price:l.price,options:l.selections||{},note:l.note||"",optionText:l.optionText||""}));
    const order={id,table:TABLE,items,total:cartTotal(),status:"new",paid:false,createdAt:Date.now()};
    if(await createOrder(order)){state.lastOrderId=id;state.cart={};state.screen="confirmed";renderCustomer()}
    else{d.querySelector("#orderError").style.display="block";btn.disabled=false;btn.textContent=T("この内容で注文する")}
  }
  function renderReview(){
    const d=document.createElement("div");
    d.className="review-wrap";
    const reviewEntries=Object.entries(state.cart);
    d.innerHTML=`<h2>${escapeHtml(T('ご注文内容の確認'))}</h2><div class="table-line"><span>${escapeHtml(T('注文テーブル'))}</span><span class="table-pill">${TABLE}</span></div>${reviewEntries.map(([key,l],idx)=>`<div class="review-line"><div class="review-item-main"><div>${escapeHtml(T(l.name))} × ${l.qty}</div>${(l.selections&&Object.keys(l.selections).length)||l.note?`<div class="review-option">${escapeHtml(localizedOptions(l))}</div>`:""}</div><div class="review-item-right"><button type="button" class="review-minus" data-review-index="${idx}" aria-label="1個減らす">−</button><div class="review-price">&yen;${(l.price*l.qty).toLocaleString()}</div></div></div>`).join("")}<div class="review-total"><span>${escapeHtml(T('合計'))}</span><span>&yen;${cartTotal().toLocaleString()}</span></div>${cartHasAlcohol()?`<div class="alcohol-review-note">${escapeHtml(T('お酒が含まれているため、注文確定時に年齢と運転予定を確認します。'))}</div>`:''}<div id="orderError" style="display:none;color:var(--lacquer);font-size:13px;margin-top:10px">${escapeHtml(T('送信できませんでした。通信状態をご確認ください。'))}</div><button class="btn-primary" id="submitOrder" style="width:100%;margin-top:18px">${escapeHtml(T('この内容で注文する'))}</button><button class="btn-ghost" id="backToMenu" style="display:block;margin:12px auto">${escapeHtml(T('メニューに戻って直す'))}</button>`;
    d.querySelectorAll(".review-minus").forEach(btn=>{
      btn.onclick=()=>{
        const entry=reviewEntries[Number(btn.dataset.reviewIndex)];
        if(!entry)return;
        const [key]=entry;
        const line=state.cart[key];
        if(!line)return;
        line.qty-=1;
        if(line.qty<=0)delete state.cart[key];
        if(cartCount()<=0){state.screen="menu";renderCustomer();return}
        renderCustomer();
      };
    });
    d.querySelector("#backToMenu").onclick=()=>{state.screen="menu";renderCustomer()};
    d.querySelector("#submitOrder").onclick=e=>{const btn=e.currentTarget;if(cartHasAlcohol())openAlcoholDialog(()=>submitReviewedOrder(btn,d));else submitReviewedOrder(btn,d)};
    return d
  }
  function renderConfirm(){const d=document.createElement("div");d.className="confirm-wrap";d.innerHTML=`<div style="font-family:var(--font-display);font-size:19px">${escapeHtml(T('ご注文を承りました'))}</div><div class="confirm-ticket"><div class="num">${TABLE}</div><div class="label">${escapeHtml(T('厨房に送信しました'))}</div></div><div class="reset-note">${escapeHtml(T('会計後はこの画面が自動でリセットされます'))}</div><button class="btn-primary" id="more" style="margin-top:20px;width:100%">${escapeHtml(T('追加で注文する'))}</button>`;d.querySelector("#more").onclick=()=>{state.screen="menu";renderCustomer()};return d}
  function activateTab(cat){document.querySelectorAll('.cat-tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.cat===cat))}
  function setupSectionObserver(){if(window.__fukuV43IO){window.__fukuV43IO.disconnect();window.__fukuV43IO=null}const sections=[...document.querySelectorAll('.menu-section > div[id^="sec-"]')];if(!sections.length)return;const io=new IntersectionObserver(entries=>{const hit=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(!hit)return;const raw=decodeURIComponent(hit.target.id.replace(/^sec-/,''));state.activeCat=raw;activateTab(raw)},{rootMargin:'-130px 0px -58% 0px',threshold:[.05,.2,.5]});sections.forEach(x=>io.observe(x));window.__fukuV43IO=io}
  function resetToStart(){state.cart={};state.started=false;state.screen='start';state.lastOrderId=null;renderCustomer();window.scrollTo({top:0,behavior:'smooth'})}
  function watchTableReset(){if(!db||!auth?.currentUser)return;try{db.ref(`tableSessions/${TABLE}/resetAt`).on('value',snap=>{const v=Number(snap.val()||0);if(!resetWatchReady){lastResetAt=v;resetWatchReady=true;return}if(v>lastResetAt){lastResetAt=v;resetToStart()}},err=>console.warn('table reset listener unavailable',err?.message||err))}catch(e){console.warn(e)}}
  function escapeHtml(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
  async function init(){
    // 安定性優先: Firebaseを待たず、まず画面とメニューを表示。
    state.menu=mergeMenuV3(DEFAULT_MENU);rebuildIndex(state.menu);state.serviceMode=currentServiceMode();state.activeCat=visibleSections()[0]?.cat||"";renderCustomer();
    if(!initFirebaseSafe()) return;
    const authed=await ensureCustomerAuth();if(!authed) return;
    watchTableReset();
    const remoteMenu=await loadMenu();if(remoteMenu&&remoteMenu.length){state.menu=remoteMenu;rebuildIndex(state.menu);if(state.screen==="menu")renderCustomer()}
    try{db.ref("menu").on("value",snap=>{if(snap.exists()){state.menu=mergeMenuV3(snap.val());rebuildIndex(state.menu);if(state.screen==="menu")renderCustomer()}},err=>console.error("menu listener error",err))}catch(e){console.error(e)}
    setInterval(()=>{const m=currentServiceMode();if(m!==state.serviceMode){state.serviceMode=m;if(state.screen==="menu")renderCustomer()}},60000);
  }
  window.addEventListener('fuku-lang-change',()=>renderCustomer());
  init();
})();
</script><script src="v4-enhance.js?v=53"></script></body></html>
